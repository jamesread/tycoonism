<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
  <defs>
    <linearGradient id="wf-fill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3d6b32"/>
      <stop offset="100%" stop-color="#5a9c4a"/>
